name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          latest="$(ls /Applications | grep -E '^Xcode' | sort -V | tail -1)"
          echo "Using ${latest}"
          sudo xcode-select -s "/Applications/${latest}/Contents/Developer"
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install

            Build and install from source with Terminal:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/DawidMoza/mac-mobile-dev-helper/main/scripts/install.sh | bash
            ```

            Requirements: macOS 13+, Xcode Command Line Tools / Swift 6.

            To install this exact tag:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/DawidMoza/mac-mobile-dev-helper/main/scripts/install.sh | bash -s -- ${{ github.ref_name }}
            ```
