name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          latest="$(ls /Applications | grep -E '^Xcode' | sort -V | tail -1)"
          echo "Using ${latest}"
          sudo xcode-select -s "/Applications/${latest}/Contents/Developer"
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Build app
        env:
          VERSION: ${{ github.ref_name }}
          BUNDLE_VERSION: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Pack release zip
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ./scripts/package-release.sh
          ASSET="dist/Mac-Mobile-Dev-Helper-${GITHUB_REF_NAME}.zip"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"
          echo "CHECKSUM=${ASSET}.sha256" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          generate_release_notes: true
          body: |
            ## Install

            macOS Gatekeeper blocks ad-hoc signed apps downloaded from the internet, including helper `.command` files in the zip. Use Terminal instead:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/DawidMoza/mac-mobile-dev-helper/main/scripts/install-release.sh | bash
            ```

            That installs into `/Applications`, clears quarantine, and launches the app.

            If you already unpacked the zip:

            ```sh
            xattr -dr com.apple.quarantine "Mac Mobile Dev Helper.app"
            open "Mac Mobile Dev Helper.app"
            ```

            Or use System Settings → Privacy & Security → Open Anyway.

